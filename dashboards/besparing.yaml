# Besparing - a dashboard of its own for what the packs save.
#
# Settings -> Dashboards -> + Add dashboard -> "New dashboard from scratch",
# name it "Besparing", open it, the pencil -> the three dots -> "Raw
# configuration editor", and replace everything with this file.
#
# The savings card finds its own entities, so it needs no ids. The graphs do:
# the ids below are what Home Assistant generates on an English install. On a
# Dutch one they may be called e.g. sensor.battery_management_besparing_vandaag
# - check under Settings -> Devices & services -> Entities, search "battery
# management", and change them here if they differ.
#
# The trading controls (Off / Shadow / On) are not here on purpose: they sit on
# the battery dashboard, beside the rest of the controls. Add the "Battery
# Management Trading" card there.
title: Besparing
views:
  - title: Besparing
    path: besparing
    icon: mdi:piggy-bank-outline
    cards:
      # today / this month / since start, green when saved, red when lost,
      # and the payback time
      - type: custom:battery-management-savings-card

      # what each day saved, as bars - the day's total is read at its close
      - type: statistics-graph
        title: Besparing per dag
        entities:
          - sensor.battery_management_savings_today
        stat_types:
          - change
        period: day
        days_to_show: 30
        chart_type: bar

      - type: statistics-graph
        title: Besparing per maand
        entities:
          - sensor.battery_management_savings_this_month
        stat_types:
          - change
        period: month
        days_to_show: 365
        chart_type: bar

      # the running total, which is what the payback time is read from
      - type: statistics-graph
        title: Besparing sinds start
        entities:
          - sensor.battery_management_savings_since_start
        stat_types:
          - state
        period: day
        days_to_show: 365
        chart_type: line

      # what the house draws while everyone sleeps - last night's lowest five
      # minutes between 01:00 and 05:00. On a Dutch install the id may be
      # sensor.battery_management_sluipverbruik.
      - type: tile
        entity: sensor.battery_management_standby_load
        name: Sluipverbruik vannacht

      - type: statistics-graph
        title: Sluipverbruik per nacht
        entities:
          - sensor.battery_management_standby_load
        # the figure is set at 05:00 and holds for a day, so a day's mean is
        # that night's, with a fifth of the night before in it
        stat_types:
          - mean
        period: day
        days_to_show: 30
        chart_type: bar
