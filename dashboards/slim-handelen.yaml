# Slim handelen - a ready-made dashboard view.
#
# Settings -> Dashboards -> open a dashboard -> the pencil -> the three dots
# -> "Raw configuration editor", and paste this under `views:` (or make a new
# dashboard and paste it as its only view).
#
# The trading card finds its own entities, so it needs no ids. The graphs do:
# the ids below are what Home Assistant generates on an English install. On a
# Dutch one they may be called e.g. sensor.battery_management_besparing_vandaag
# and sensor.battery_management_terugverdientijd - check under
# Settings -> Devices & services -> Entities, search "battery management".
title: Slim handelen
path: slim-handelen
icon: mdi:swap-vertical-bold
cards:
  - type: custom:battery-management-trade-card

  # what each day saved, as bars - the day's total is read at its close
  - type: statistics-graph
    title: Besparing per dag
    entities:
      - sensor.battery_management_savings_today
    stat_types:
      - change
    period: day
    days_to_show: 30
    chart_type: bar

  - type: statistics-graph
    title: Besparing per maand
    entities:
      - sensor.battery_management_savings_this_month
    stat_types:
      - change
    period: month
    days_to_show: 365
    chart_type: bar

  # when it sold or would have, beside the price - the one graph that
  # answers "did it pick the right evening"
  - type: history-graph
    title: Handelen en prijs
    hours_to_show: 48
    entities:
      - sensor.battery_management_smart_trading_status
      - sensor.battery_management_current_price

  - type: entities
    title: Instellingen
    entities:
      - select.battery_management_smart_trading
      - number.battery_management_sell_down_to_at_least
      - sensor.battery_management_payback_time
