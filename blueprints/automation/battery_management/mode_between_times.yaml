blueprint:
  name: Battery Management - mode between two times
  description: >
    Switch the coordinator to one mode at a start time and back at an end time,
    optionally only on certain weekdays.


    Simpler than the Schedule version: no helper to create, but one window per
    automation. Add the automation twice for two windows a day.


    A window that crosses midnight works fine - set the start later than the end.
  domain: automation
  source_url: https://github.com/Mischa323/ha-battery-management/blob/master/blueprints/automation/battery_management/mode_between_times.yaml
  input:
    start_time:
      name: Start
      selector:
        time:
    end_time:
      name: End
      selector:
        time:
    weekdays:
      name: Days
      description: Leave all selected to run every day.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    mode_entity:
      name: Battery Management mode
      selector:
        entity:
          filter:
            domain: select
            integration: battery_management
    mode_during:
      name: Mode inside the window
      default: charge_only
      selector:
        select:
          options:
            - label: Follow the meter
              value: grid_zero
            - label: Charge only (never discharge)
              value: charge_only
            - label: Discharge only (never charge)
              value: discharge_only
            - label: Pause (hold at zero)
              value: pause
    mode_outside:
      name: Mode after the window
      default: grid_zero
      selector:
        select:
          options:
            - label: Follow the meter
              value: grid_zero
            - label: Charge only (never discharge)
              value: charge_only
            - label: Discharge only (never charge)
              value: discharge_only
            - label: Pause (hold at zero)
              value: pause

mode: single
max_exceeded: silent

variables:
  mode_during: !input mode_during
  mode_outside: !input mode_outside

trigger:
  - platform: time
    at: !input start_time
    id: window_start
  - platform: time
    at: !input end_time
    id: window_end

condition:
  - condition: time
    weekday: !input weekdays

action:
  - service: select.select_option
    target:
      entity_id: !input mode_entity
    data:
      option: >-
        {{ mode_during if trigger.id == 'window_start' else mode_outside }}
